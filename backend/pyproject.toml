[project]
name = "uvxy-risk-backend"
version = "0.1.0"
description = "UVXY risk project backend: data layer, volatility regime detector, API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "hmmlearn>=0.3.2",
    "joblib>=1.4",
    "threadpoolctl>=3.5",
    "pyarrow>=16",
    "requests>=2.32",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
